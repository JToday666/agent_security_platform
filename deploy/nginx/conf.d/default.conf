# ============================================================
# AEGIS / Agent Security Platform - Docker Nginx Gateway
# Path: deploy/nginx/conf.d/default.conf
#
# Public:
#   /              -> Vue frontend dist
#   /api/          -> backend-api:8000
#   /uploads/      -> backend-api:8000
#
# Notes:
#   - backend-api must be in the same Docker network: asp-net
#   - frontend build output must be mounted to /usr/share/nginx/html
# ============================================================

# Per-client request rate limits.
# These directives must be in http context; files under /etc/nginx/conf.d/*.conf
# are included inside http {} by the official nginx image.
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=login_rate:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Adjust if your platform needs larger dataset/report uploads.
    client_max_body_size 100m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    limit_conn perip_conn 30;

    # Docker embedded DNS resolver.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # --------------------------------------------iendly JSON fallback for unavailable backend----------------
    # Fr.
    # Prevent frontend from displaying raw Nginx HTML 502 pages.
    # ------------------------------------------------------------
    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":"BACKEND_UNAVAILABLE","message":"后端服务暂不可用，请稍后重试。"}';
    }

    # ------------------------------------------------------------
    # Deny sensitive files if they ever appear under the static root.
    # ------------------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* \.(env|ini|log|bak|backup|old|orig|sql|sqlite|db|pem|key|crt|csr|conf|yaml|yml|toml)$ {
        deny all;
        return 404;
    }

    location ~* /(Dockerfile|docker-compose.*\.ya?ml|package\.json|pnpm-lock\.yaml|pyproject\.toml|requirements.*\.txt)$ {
        deny all;
        return 404;
    }

    # ------------------------------------------------------------
    # Health check for Nginx itself.
    # ------------------------------------------------------------
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------
    # Frontend static assets.
    # ------------------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------
    # Backend API.
    # backend-api must be reachable in Docker network asp-net.
    # If backend is not running, return JSON 503 instead of HTML 502.
    # ------------------------------------------------------------
    location /api/ {
        limit_except GET POST PUT PATCH DELETE OPTIONS {
            deny all;
        }

        limit_req zone=api_rate burst=20 nodelay;

        set $backend "http://backend-api:8000";
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    # ------------------------------------------------------------
    # Optional stricter rate limit for login endpoints.
    # Adjust paths according to actual backend routes.
    # ------------------------------------------------------------
    location ~ ^/api/v1/(auth/login|login|users/login)$ {
        limit_except POST OPTIONS {
            deny all;
        }

        limit_req zone=login_rate burst=5 nodelay;

        set $backend "http://backend-api:8000";
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    # ------------------------------------------------------------
    # Uploads / downloadable files proxied to backend.
    # If your backend does not use /uploads/, this block is harmless.
    # ------------------------------------------------------------
    location /uploads/ {
        limit_req zone=api_rate burst=10 nodelay;

        set $backend "http://backend-api:8000";
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    # ------------------------------------------------------------
    # Hide backend API docs from public.
    # If you need temporary access, create a separate allowlist rule.
    # ------------------------------------------------------------
    location ~ ^/(docs|redoc|openapi\.json)$ {
        deny all;
        return 404;
    }

    # ------------------------------------------------------------
    # Vue Router history mode fallback.
    # This must be after API/uploads/static-specific locations.
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}

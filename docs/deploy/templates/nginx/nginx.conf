user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_x_request_id $asp_request_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format asp_json escape=json
        '{'
        '"ts":"$time_iso8601",'
        '"level":"INFO",'
        '"service":"nginx",'
        '"env":"production",'
        '"event":"http.access",'
        '"requestId":"$asp_request_id",'
        '"upstreamRequestId":"$upstream_http_x_request_id",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"statusCode":$status,'
        '"durationSec":$request_time,'
        '"upstreamDurationSec":"$upstream_response_time",'
        '"upstreamStatus":"$upstream_status",'
        '"bytesSent":$body_bytes_sent,'
        '"clientIp":"$remote_addr",'
        '"forwardedFor":"$http_x_forwarded_for",'
        '"host":"$host",'
        '"userAgent":"$http_user_agent"'
        '}';

    access_log  /var/log/nginx/access.log asp_json;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;
    client_max_body_size 100m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
